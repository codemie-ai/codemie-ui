      x: 0
      y: 300
  - id: kind_b
    type: assistant
    position:
      x: 400
      y: 300
  - id: a_step_1
    type: assistant
    position:
      x: 800
      y: 300
  - id: merge
    type: assistant
    position:
      x: 1200
      y: 300
  - id: fan_1
    type: assistant
    position:
      x: 1600
      y: 300
  - id: fan_join
    type: assistant
    position:
      x: 0
      y: 600
  - id: review_one
    type: assistant
    position:
      x: 400
      y: 600
  - id: manual_review
    type: assistant
    position:
      x: 800
