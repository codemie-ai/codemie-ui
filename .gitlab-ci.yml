include:
  - project: "epm-cdme/codemie-gitlab-templates"
    ref: "0.1.1"
    file: "/templates/pre-ci-guard.yml"

workflow:
  auto_cancel:
    on_new_commit: interruptible

  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - when: never

stages:
  - pre-ci-guard

no-op:
  stage: pre-ci-guard
  script:
    - echo "Skipping CI guards for non-main target branch"
  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME != "main"'

wait-ci-init:
  extends: .wait-ci-init-template

  rules:
    - if: '$CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"'

  variables:
    EXPECTED_CONTEXTS: |
      ci-pipeline
      compliance-report
