# nginx config for the local fast UI-test mode (Dockerfile.test / compose
# profile `uitest`). Serves the production bundle and proxies /api to the
# backend service — the shipped nginx.conf has no /api location because
# production terminates that route at the ingress.
server {
    listen 5173;
    listen [::]:5173;
    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        # The trailing slash strips the /api prefix. This approximates (not
        # mirrors) the Vite dev proxy rewrite (^/api -> ''): unlike Vite's raw
        # string replace, nginx forwards the decoded, normalized URI, so
        # percent-encoded path segments (e.g. an encoded "/" in a slug) can
        # route differently than under the dev server.
        proxy_pass http://codemie:8080/;
        proxy_http_version 1.1;
        # Mirror the dev proxy's `changeOrigin: true` (vite.config.ts), which
        # rewrites Host to its target, localhost:8080 — do NOT forward the
        # client's Host here. The backend builds client-facing absolute URLs
        # from this header (e.g. routers/files.py derives file_url from
        # request.base_url.netloc), and those URLs are returned to the browser
        # without an /api prefix. Forwarding localhost:5173 would point them at
        # this server, where they miss `location /api/` and fall through to the
        # SPA catch-all — serving index.html instead of the file. localhost:8080
        # is the published backend port, so the URLs stay reachable from the
        # host and match what the dev server produces.
        proxy_set_header Host localhost:8080;
        # Chat responses stream as chunked HTTP (fetch + ReadableStream);
        # buffering would stall them.
        proxy_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 100m;
    }

    # Runtime config baked by Dockerfile.test; never cache it, matching the
    # production nginx.conf behavior.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
